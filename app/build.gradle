plugins { id "com.android.application" }
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer
android {
    namespace "com.sulcisoca.app"
    compileSdk 34
    defaultConfig {
        applicationId "com.sulcisoca.app"
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.getByName("debug")
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress "mp3" }
}
dependencies { implementation "androidx.webkit:webkit:1.11.0" }
