name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle --no-daemon assembleRelease
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk SulcisOca.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SulcisOca-apk
          path: SulcisOca.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SulcisOca Android 1.0.${{ github.run_number }}
          make_latest: true
          files: SulcisOca.apk
          body: |
            Scarica **SulcisOca.apk** qui sotto e installalo sul telefono (consenti "installa app da origini sconosciute").
            Il gioco funziona tutto offline, senza server. Controller Xbox via Bluetooth supportato.
